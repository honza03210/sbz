<style>
  :root {

  body {

    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px
             calc(40px + env(safe-area-inset-bottom)) 16px;
  }

  header { text-align: center; margin: 14px 0 18px; }
  header h1 { font-size: 1.35rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0 auto; max-width: 56ch; color: var(--muted); font-size: 0.9rem; }

  .search {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 0.95rem;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { outline: none; border-color: var(--accent); }

  .filters {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-bottom: 18px;
  }
  .chip {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .count { text-align: center; color: var(--muted); font-size: 0.8rem; margin: 0 0 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 20px;
    margin-bottom: 14px;
    animation: pop .22s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  .card .top {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
  }
  .card .cat {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent-2);
    font-weight: 700;
  }
  .card .num {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .card h2 { margin: 0 0 12px; font-size: 1.3rem; letter-spacing: -0.02em; }

  .opener {
    background: var(--card-2);
    border-left: 3px solid var(--accent);
    border-radius: 0 12px 12px 0;
    padding: 13px 15px;
    font-size: 1.05rem;
    margin: 0;
  }

  .math {
    margin: 14px 0 0;
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    background: rgba(69, 208, 168, .05);
  }
  .math .label {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent-2);
    font-weight: 700;
    margin: 0 0 7px;

  .math ul { margin: 0; padding: 0; list-style: none; }
  .math li {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Cambria Math", serif;
    font-size: 0.92rem;
    color: var(--ink);
    padding: 3px 0;
    line-height: 1.5;
  }
  .math li + li { border-top: 1px solid rgba(44,53,86,.6); }

  .codes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.72rem;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 3px 8px;
    border-radius: 7px;
  }

  .empty { text-align: center; color: var(--muted); padding: 40px 12px; }

  mark { background: rgba(108,140,255,.35); color: inherit; border-radius: 3px; padding: 0 2px; }

  @media print {
    body { background: #fff; color: #000; }
    .search, .filters, .count, .nav { display: none !important; }
    .card { border: 1px solid #ccc; box-shadow: none; break-inside: avoid; }
    .opener { background: #f3f3f3; }
    .math { background: #fafafa; }
  }

  .nav { text-align: center; margin: 2px 0 18px; }
  .nav a { color: var(--accent); text-decoration: none; font-size: 0.82rem; }
  .nav a:hover { text-decoration: underline; }
</style>
</head>

const CAT_LABELS = {
  "Matematika a teoretická informatika": "Matematika a TI",
  "Programové, výpočetní a informační systémy": "Programové systémy"
};

const listEl = document.getElementById("list");
const filtersEl = document.getElementById("filters");
const countEl = document.getElementById("count");
const searchEl = document.getElementById("search");

let activeFilter = "Vše";
let query = "";

const categories = [...new Set(TOPICS.map(t => t.cat))];

function renderFilters() {
  filtersEl.innerHTML = "";
  ["Vše", ...categories].forEach(name => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = CAT_LABELS[name] || name;
    btn.title = name;
    btn.setAttribute("aria-pressed", String(name === activeFilter));
    btn.addEventListener("click", () => {
      activeFilter = name;
      [...filtersEl.children].forEach(c =>
        c.setAttribute("aria-pressed", String(c === btn)));
      render();
    });
    filtersEl.appendChild(btn);
  });
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function highlight(text, q) {
  const safe = escapeHtml(text);
  if (!q) return safe;
  // case-insensitive highlight of every occurrence of the query
  try {
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    return safe.replace(re, "<mark>$1</mark>");
  } catch {
    return safe;
  }
}

function matches(topic, q) {
  if (!q) return true;
  const hay = (topic.title + " " + topic.opener + " " +
    (topic.math ? topic.math.join(" ") : "") + " " +
    topic.codes.join(" ")).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function render() {
  const q = query.trim();
  const items = TOPICS.filter(t =>
    (activeFilter === "Vše" || t.cat === activeFilter) && matches(t, q));

  countEl.textContent = items.length + " z " + TOPICS.length + " okruhů";

  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty">Žádný okruh neodpovídá hledání.</div>';
    return;
  }

  listEl.innerHTML = items.map(t => {
    const numIndex = TOPICS.indexOf(t) + 1;
    const codes = t.codes.map(c =>
      '<span class="code">' + escapeHtml(c) + '</span>').join("");
    const math = t.math ? (
      '<div class="math"><p class="label">Matematicky</p><ul>' +
      t.math.map(m => '<li>' + highlight(m, q) + '</li>').join("") +
      '</ul></div>'
    ) : "";
    return (
      '<article class="card">' +
        '<div class="top">' +
          '<span class="cat">' + escapeHtml(CAT_LABELS[t.cat] || t.cat) + '</span>' +
          '<span class="num">#' + numIndex + '</span>' +
        '</div>' +
        '<h2>' + highlight(t.title, q) + '</h2>' +
        '<p class="opener">' + highlight(t.opener, q) + '</p>' +
        math +
        '<div class="codes">' + codes + '</div>' +
      '</article>'
    );
  }).join("");
}

searchEl.addEventListener("input", () => {
  query = searchEl.value;
  render();
});

renderFilters();
render();
