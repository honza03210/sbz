<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1424">
<title>První věty ke státnicím</title>
<style>
  :root {
    --bg: #0f1424;
    --card: #1a2138;
    --card-2: #232c49;
    --ink: #eef1f8;
    --muted: #9aa4c4;
    --accent: #6c8cff;
    --accent-2: #45d0a8;
    --line: #2c3556;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px
             calc(40px + env(safe-area-inset-bottom)) 16px;
  }

  header { text-align: center; margin: 14px 0 18px; }
  header h1 { font-size: 1.35rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0 auto; max-width: 58ch; color: var(--muted); font-size: 0.9rem; }

  .search {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 0.95rem;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { outline: none; border-color: var(--accent); }

  .filters {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-bottom: 18px;
  }
  .chip {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .count { text-align: center; color: var(--muted); font-size: 0.8rem; margin: 0 0 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 20px;
    margin-bottom: 14px;
    animation: pop .22s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  .card .top {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
  }
  .card .cat {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent-2);
    font-weight: 700;
  }
  .card .num {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .card h2 { margin: 0 0 12px; font-size: 1.3rem; letter-spacing: -0.02em; }

  .opener {
    background: var(--card-2);
    border-left: 3px solid var(--accent);
    border-radius: 0 12px 12px 0;
    padding: 13px 15px;
    font-size: 1.05rem;
    margin: 0;
  }

  .math {
    margin: 14px 0 0;
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    background: rgba(69, 208, 168, .05);
  }
  .math .label {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent-2);
    font-weight: 700;
    margin: 0 0 7px;
  }
  .math ul { margin: 0; padding: 0; list-style: none; }
  .math li {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Cambria Math", serif;
    font-size: 0.92rem;
    color: var(--ink);
    padding: 3px 0;
    line-height: 1.5;
  }
  .math li + li { border-top: 1px solid rgba(44,53,86,.6); }

  .subs { margin-top: 16px; }
  .subs-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin: 0 0 8px;
  }
  .section-label {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); font-weight: 700; margin: 0;
  }
  .subs-toggle {
    background: none; border: 1px solid var(--line); color: var(--muted);
    font-family: inherit; font-size: 0.72rem; padding: 4px 11px;
    border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  details.sub {
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-top: 6px;
    background: var(--card-2);
    overflow: hidden;
  }
  details.sub summary {
    cursor: pointer;
    padding: 9px 32px 9px 12px;
    font-weight: 600;
    font-size: 0.92rem;
    list-style: none;
    position: relative;
  }
  details.sub summary::-webkit-details-marker { display: none; }
  details.sub summary::after {
    content: "+";
    position: absolute; right: 12px; top: 8px;
    color: var(--muted); font-size: 1.1rem; line-height: 1;
  }
  details.sub[open] summary::after { content: "\2212"; }
  .sub-body {
    margin: 0;
    padding: 0 12px 11px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .codes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.72rem;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 3px 8px;
    border-radius: 7px;
  }

  .empty { text-align: center; color: var(--muted); padding: 40px 12px; }
  mark { background: rgba(108,140,255,.35); color: inherit; border-radius: 3px; padding: 0 2px; }

  .nav { text-align: center; margin: 2px 0 18px; }
  .nav a { color: var(--accent); text-decoration: none; font-size: 0.82rem; }
  .nav a:hover { text-decoration: underline; }

  @media print {
    body { background: #fff; color: #000; }
    .search, .filters, .count, .nav, .subs-toggle { display: none !important; }
    .card { border: 1px solid #ccc; box-shadow: none; break-inside: avoid; }
    .opener { background: #f3f3f3; }
    .math { background: #fafafa; }
    details.sub { break-inside: avoid; }
    details.sub > .sub-body { display: block !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎤 První věty ke státnicím</h1>
    <p>Úvodní věty (max. 3) ke každému okruhu i ke každému dílčímu pojmu — to, čím začneš odpověď před komisí. Kde to dává smysl, je přidaná matematická definice.</p>
  </header>

  <div class="nav"><a href="index.html">← Náhodné téma (procvičování)</a></div>

  <input type="search" class="search" id="search" placeholder="Hledat okruh nebo pojem…" autocomplete="off">

  <div class="filters" id="filters"></div>
  <p class="count" id="count"></p>

  <main id="list"></main>
</div>

    { t: "Vlastnosti lineárních operací a skalární součin", s: "Operace vektorového prostoru splňují osm axiomů (asociativita, komutativita sčítání, distributivita). Skalární součin u·v = Σ uᵢvᵢ přiřazuje dvojici vektorů číslo, určuje délku |u|=√(u·u) i úhel a nulový součin znamená kolmost. Ve 3D existuje navíc vektorový součin u×v, který je kolmý na oba činitele a jehož velikost je obsah rovnoběžníku." },

    { t: "Relace a zobrazení", s: "Relace je podmnožina kartézského součinu A×B, tedy množina uspořádaných dvojic; zobrazení je speciální relace, kde každému vstupu přísluší právě jeden výstup. Zobrazení může být injektivní (prosté), surjektivní (na) nebo bijektivní; bijekce má inverzi. Skládání zobrazení je asociativní, ale obecně nekomutativní." },

<script>
const CAT_LABELS = {
  "Matematika a teoretická informatika": "Matematika a TI",
  "Programové, výpočetní a informační systémy": "Programové systémy"
};

const listEl = document.getElementById("list");
const filtersEl = document.getElementById("filters");
const countEl = document.getElementById("count");
const searchEl = document.getElementById("search");

let activeFilter = "Vše";
let query = "";

const categories = [...new Set(TOPICS.map(t => t.cat))];

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function highlight(text, q) {
  const safe = escapeHtml(text);
  if (!q) return safe;
  try {
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    return safe.replace(re, "<mark>$1</mark>");
  } catch {
    return safe;
  }
}

function subMatches(sub, q) {
  return (sub.t + " " + sub.s).toLowerCase().includes(q);
}

function topicMatches(t, q) {
  if (!q) return true;
  const hay = (t.title + " " + t.opener + " " +
    (t.math ? t.math.join(" ") : "") + " " +
    t.codes.join(" ") + " " +
    (t.subs || []).map(s => s.t + " " + s.s).join(" ")).toLowerCase();
  return hay.includes(q);
}

function renderFilters() {
  filtersEl.innerHTML = "";
  ["Vše", ...categories].forEach(name => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = CAT_LABELS[name] || name;
    btn.title = name;
    btn.setAttribute("aria-pressed", String(name === activeFilter));
    btn.addEventListener("click", () => {
      activeFilter = name;
      [...filtersEl.children].forEach(c =>
        c.setAttribute("aria-pressed", String(c === btn)));
      render();
    });
    filtersEl.appendChild(btn);
  });
}

function render() {
  const q = query.trim().toLowerCase();
  const items = TOPICS.filter(t =>
    (activeFilter === "Vše" || t.cat === activeFilter) && topicMatches(t, q));

  countEl.textContent = items.length + " z " + TOPICS.length + " okruhů";

  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty">Žádný okruh neodpovídá hledání.</div>';
    return;
  }

  listEl.innerHTML = items.map(t => {
    const numIndex = TOPICS.indexOf(t) + 1;
    const codes = t.codes.map(c =>
      '<span class="code">' + escapeHtml(c) + '</span>').join("");
    const math = t.math ? (
      '<div class="math"><p class="label">Matematicky</p><ul>' +
      t.math.map(m => '<li>' + highlight(m, q) + '</li>').join("") +
      '</ul></div>'
    ) : "";
    const subs = (t.subs || []).map(s => {
      const open = q && subMatches(s, q) ? " open" : "";
      return '<details class="sub"' + open + '>' +
        '<summary>' + highlight(s.t, q) + '</summary>' +
        '<p class="sub-body">' + highlight(s.s, q) + '</p>' +
        '</details>';
    }).join("");
    const subsBlock = (t.subs && t.subs.length) ? (
      '<div class="subs">' +
        '<div class="subs-head">' +
          '<p class="section-label">Dílčí pojmy · ' + t.subs.length + '</p>' +
          '<button class="subs-toggle" type="button">Rozbalit pojmy</button>' +
        '</div>' + subs +
      '</div>'
    ) : "";
    return (
      '<article class="card">' +
        '<div class="top">' +
          '<span class="cat">' + escapeHtml(CAT_LABELS[t.cat] || t.cat) + '</span>' +
          '<span class="num">#' + numIndex + '</span>' +
        '</div>' +
        '<h2>' + highlight(t.title, q) + '</h2>' +
        '<p class="opener">' + highlight(t.opener, q) + '</p>' +
        math + subsBlock +
        '<div class="codes">' + codes + '</div>' +
      '</article>'
    );
  }).join("");
}

listEl.addEventListener("click", e => {
  const btn = e.target.closest(".subs-toggle");
  if (!btn) return;
  const card = btn.closest(".card");
  const ds = [...card.querySelectorAll("details.sub")];
  const anyOpen = ds.some(d => d.open);
  ds.forEach(d => d.open = !anyOpen);
  btn.textContent = anyOpen ? "Rozbalit pojmy" : "Sbalit pojmy";
});

searchEl.addEventListener("input", () => {
  query = searchEl.value;
  render();
});

renderFilters();
render();
</script>
